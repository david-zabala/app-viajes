<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Buscador de Pasajes - Kayak</title>
</head>
<body>
  <h1>Buscar precio de pasajes (Kayak)</h1>
  <form method="post">
    Origen (ej: BOG): <input type="text" name="origen" required><br>
    Destino (ej: ZAG): <input type="text" name="destino" required><br>
    Fecha salida (YYYY-MM-DD): <input type="date" name="salida" required><br>
    Fecha regreso (YYYY-MM-DD): <input type="date" name="regreso" required><br>
    <button type="submit">Buscar y guardar</button>
  </form>
  <p><a href="/historial">Ver historial</a></p>
</body>
</html>
